services:
  - type: web
    name: commute-mvp
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    initialDeployHook: npm run seed
    healthCheckPath: /api/corridors
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/commute.db
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
    disk:
      name: commute-data
      mountPath: /var/data
      sizeGB: 1
